<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>SnakeAI – Space Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
body{font-family:'Orbitron',sans-serif;color:#fff;display:flex;align-items:center;justify-content:center}

canvas#bgCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}

.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .4s ease;z-index:5}
.screen.active{opacity:1;pointer-events:all}

/* ── START SCREEN ── */
.start-card{
  display:flex;flex-direction:column;align-items:center;gap:18px;
  padding:28px 24px;max-width:440px;width:92%;
  background:rgba(4,4,28,.85);border:1px solid #0055bb44;border-radius:10px;
  box-shadow:0 0 60px #0022aa22,inset 0 0 40px rgba(0,0,20,.5);
}
.title{
  font-size:clamp(2.2rem,9vw,4.2rem);font-weight:900;letter-spacing:.1em;
  background:linear-gradient(135deg,#00ffff,#0088ff,#aa00ff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 24px #00ccff88);animation:glow 3s ease-in-out infinite;
}
.subtitle{font-size:.65rem;letter-spacing:.45em;color:#0077cc;margin-top:-12px}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 20px #00ccff66)}50%{filter:drop-shadow(0 0 40px #00ccffcc)}}

.field-label{font-size:.6rem;letter-spacing:.3em;color:#0077cc;align-self:flex-start}
.name-input{
  width:100%;background:rgba(0,100,255,.08);border:1px solid #0055bb44;border-radius:5px;
  color:#00ffff;font-family:'Share Tech Mono',monospace;font-size:.95rem;padding:9px 14px;
  outline:none;letter-spacing:.1em;transition:all .25s;text-align:center;
}
.name-input:focus{border-color:#00ffff66;box-shadow:0 0 12px #00ffff22}
.name-input::placeholder{color:#0055bb88}

.diff-row{display:flex;gap:8px;width:100%}
.diff-btn{
  flex:1;padding:9px 4px;border-radius:5px;border:1px solid currentColor;background:transparent;
  font-family:'Orbitron',sans-serif;font-size:.65rem;font-weight:700;letter-spacing:.08em;
  cursor:pointer;transition:all .25s;text-transform:uppercase;
}
.diff-btn.easy{color:#00ff88}.diff-btn.medium{color:#ffaa00}.diff-btn.hard{color:#ff4444}
.diff-btn.sel,.diff-btn:hover{background:rgba(255,255,255,.1);box-shadow:0 0 12px currentColor}

.launch-btn{
  width:100%;padding:13px;border-radius:6px;border:1px solid #00ffff;
  background:linear-gradient(135deg,rgba(0,255,255,.15),rgba(0,100,255,.15));
  color:#00ffff;font-family:'Orbitron',sans-serif;font-size:.9rem;font-weight:700;
  letter-spacing:.2em;cursor:pointer;transition:all .3s;
  animation:btnpulse 2s ease-in-out infinite;
}
.launch-btn:hover{background:rgba(0,255,255,.25);box-shadow:0 0 28px #00ffff44}
@keyframes btnpulse{0%,100%{box-shadow:0 0 8px #00ffff22}50%{box-shadow:0 0 22px #00ffff55}}

.lb-box{width:100%;border:1px solid #0044aa22;border-radius:6px;padding:10px 12px;background:rgba(0,0,20,.5)}
.lb-title{font-size:.55rem;letter-spacing:.35em;color:#0077cc;text-align:center;margin-bottom:7px}
.lb-list{list-style:none}
.lb-list li{display:flex;align-items:center;padding:3px 0;border-bottom:1px solid #0044aa18;
  font-family:'Share Tech Mono',monospace;font-size:.72rem}
.lb-list li:last-child{border:none}
.lb-rank{width:28px;color:#0077cc}.lb-name{flex:1;color:#bbccff}
.lb-diff{font-size:.55rem;color:#0077cc88;margin-right:6px}
.lb-score{color:#00ffff}
.lb-empty{font-family:'Share Tech Mono',monospace;font-size:.68rem;color:#0044aa88;text-align:center;padding:8px 0}

/* ── GAME SCREEN ── */
#gameScreen{z-index:5}
#gameWrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:8px}

#hudRow{
  display:flex;align-items:center;gap:10px;width:100%;
  font-family:'Share Tech Mono',monospace;
  background:rgba(0,4,28,.72);border:1px solid #0055bb44;border-radius:7px;
  padding:8px 14px;backdrop-filter:blur(4px);
}
.hud-block{display:flex;flex-direction:column;align-items:center}
.hud-lbl{font-size:.65rem;letter-spacing:.3em;color:#0099ee}
.hud-val{font-size:1.8rem;color:#fff;font-weight:bold;text-shadow:0 0 12px #00ffff99,0 0 4px #fff}
#powerBar{
  flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:.65rem;min-height:32px;
}
#puIndicator{
  display:none;align-items:center;gap:7px;
  border:1px solid currentColor;border-radius:20px;padding:4px 11px;
  background:rgba(0,0,0,.6);font-size:.68rem;
}
#puTimerWrap{width:70px;height:3px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
#puTimerFill{height:100%;border-radius:2px;transition:width .1s linear}

.icon-btn{
  background:rgba(0,80,200,.15);border:1px solid #0055cc55;border-radius:5px;
  color:#00ccff;font-size:1.1rem;padding:7px 13px;cursor:pointer;transition:all .2s;
  font-family:inherit;
}
.icon-btn:hover{background:rgba(0,200,255,.2);color:#00ffff}

#canvasWrap{position:relative}
#gameCanvas{display:block;border:1px solid #0055cc55;border-radius:6px;
  box-shadow:0 0 60px #0033cc33,0 0 120px #001166,inset 0 0 30px rgba(0,10,40,.8)}

#pauseOverlay{
  position:absolute;inset:0;border-radius:4px;
  background:rgba(0,0,18,.88);display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:16px;
}
#pauseOverlay.show{display:flex}
.pause-title{font-size:2rem;font-weight:900;letter-spacing:.3em;color:#00ffff;text-shadow:0 0 24px #00ffff}
.pause-hint{font-size:.62rem;letter-spacing:.3em;color:#0077cc;font-family:'Share Tech Mono',monospace}

/* Countdown overlay */
#countdownOverlay{
  position:absolute;inset:0;border-radius:4px;
  background:rgba(0,0,18,.75);display:none;
  flex-direction:column;align-items:center;justify-content:center;
}
#countdownOverlay.show{display:flex}
#countdownNum{
  font-size:6rem;font-weight:900;color:#00ffff;
  text-shadow:0 0 60px #00ffff;animation:cdbounce .8s ease-out;
}
@keyframes cdbounce{from{transform:scale(1.6);opacity:0}to{transform:scale(1);opacity:1}}

/* Mobile D-Pad */
#dpad{display:none;margin-top:4px}
#dpad.show{display:block}
.drow{display:flex;justify-content:center;gap:4px;margin:2px 0}
.dbtn{
  width:58px;height:58px;border-radius:8px;border:1px solid #0055bb55;
  background:rgba(0,80,200,.12);color:#00ccff;font-size:1.5rem;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation;
  transition:all .12s;
}
.dbtn:active,.dbtn.pressed{background:rgba(0,200,255,.22);box-shadow:0 0 12px #00ffff44;transform:scale(.94)}
.dblank{width:58px;height:58px}

/* ── GAME OVER SCREEN ── */
#goScreen{z-index:10;background:rgba(0,0,12,.72)}
.go-card{
  display:flex;flex-direction:column;align-items:center;gap:18px;
  padding:28px 24px;max-width:420px;width:92%;
  border:1px solid #ff333344;border-radius:10px;
  background:rgba(20,0,0,.85);box-shadow:0 0 60px #ff000022;
  animation:slidein .4s ease-out;
}
@keyframes slidein{from{transform:scale(.85) translateY(20px);opacity:0}to{transform:none;opacity:1}}
.go-title{
  font-size:clamp(1.4rem,6vw,2.2rem);font-weight:900;letter-spacing:.2em;
  color:#ff4444;text-shadow:0 0 30px #ff0000;animation:flicker .4s ease 3;
}
@keyframes flicker{0%,100%{opacity:1}50%{opacity:.4}}
.go-score-lbl{font-size:.55rem;letter-spacing:.4em;color:#0077cc;font-family:'Share Tech Mono',monospace}
.go-score{font-size:clamp(2.2rem,9vw,3.5rem);font-weight:900;color:#fff;
  font-family:'Share Tech Mono',monospace;text-shadow:0 0 20px #00ffff}
.go-badge{
  display:none;font-size:.85rem;font-weight:700;letter-spacing:.2em;
  background:linear-gradient(135deg,#ffd700,#ffaa00);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 6px #ffaa00);
}
.go-badge.show{display:block}
.go-btns{display:flex;gap:10px;width:100%}
.retry-btn{
  flex:2;padding:12px;border-radius:6px;border:1px solid #00ffff;
  background:rgba(0,255,255,.12);color:#00ffff;font-family:'Orbitron',sans-serif;
  font-size:.8rem;font-weight:700;letter-spacing:.15em;cursor:pointer;transition:all .25s;
}
.retry-btn:hover{background:rgba(0,255,255,.25);box-shadow:0 0 20px #00ffff33}
.menu-btn{
  flex:1;padding:12px;border-radius:6px;border:1px solid #0044aa44;
  background:transparent;color:#0077cc;font-family:'Orbitron',sans-serif;
  font-size:.78rem;letter-spacing:.1em;cursor:pointer;transition:all .25s;
}
.menu-btn:hover{background:rgba(0,80,200,.15)}

/* ── MATH MODE ── */
.math-toggle{
  width:100%;padding:9px;border-radius:5px;border:1px solid #00ff8844;
  background:transparent;color:#00ff8866;font-family:'Orbitron',sans-serif;
  font-size:.62rem;font-weight:700;letter-spacing:.15em;cursor:pointer;transition:all .25s;
}
.math-toggle.on{background:rgba(0,255,136,.12);color:#00ff88;border-color:#00ff88;box-shadow:0 0 12px #00ff8844}
.math-toggle:hover{background:rgba(0,255,136,.07);color:#00ff88aa}

#mathBar{
  width:100%;text-align:center;padding:7px 14px;
  background:rgba(0,30,10,.75);border:1px solid #00ff8844;border-radius:6px;
  font-family:'Share Tech Mono',monospace;color:#00ff88;
  letter-spacing:.06em;text-shadow:0 0 8px #00ff8855;
  display:none;
}
#mathQ-label{font-size:.55rem;letter-spacing:.35em;color:#00aa55;margin-right:10px}
#mathQuestion{font-size:1.05rem;font-weight:bold}

/* Toast */
#toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);
  background:rgba(0,0,24,.95);border:1px solid #00ffff88;border-radius:5px;
  padding:9px 20px;font-family:'Share Tech Mono',monospace;font-size:.72rem;
  color:#00ffff;letter-spacing:.15em;pointer-events:none;
  transition:transform .3s ease;z-index:100;box-shadow:0 0 20px #00ffff33;
}
#toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<!-- ══ START SCREEN ══ -->
<div id="startScreen" class="screen active">
  <div class="start-card">
    <div>
      <div class="title">SnakeAI</div>
      <div class="subtitle">✦ SPACE EDITION ✦</div>
    </div>
    <div style="width:100%">
      <div class="field-label" style="margin-bottom:6px">▸ PILOT NAME</div>
      <input class="name-input" id="nameInput" type="text" placeholder="Enter callsign…" maxlength="18" autocomplete="off" spellcheck="false">
    </div>
    <div style="width:100%">
      <div class="field-label" style="margin-bottom:8px">▸ MISSION DIFFICULTY</div>
      <div class="diff-row">
        <button class="diff-btn easy"   data-d="easy">EASY</button>
        <button class="diff-btn medium sel" data-d="medium">MEDIUM</button>
        <button class="diff-btn hard"   data-d="hard">HARD</button>
      </div>
    </div>
    <div style="width:100%">
      <div class="field-label" style="margin-bottom:8px">▸ MATH CHALLENGE MODE</div>
      <button class="math-toggle" id="mathToggle">📐 ENABLE MATH CHALLENGES</button>
    </div>
    <button class="launch-btn" id="launchBtn">▶ LAUNCH MISSION</button>
    <div class="lb-box">
      <div class="lb-title">▸ HALL OF FAME ◂</div>
      <ul class="lb-list" id="startLb"><li class="lb-empty">No scores yet — be the first!</li></ul>
    </div>
  </div>
</div>

<!-- ══ GAME SCREEN ══ -->
<div id="gameScreen" class="screen">
  <div id="gameWrap">
    <div id="hudRow">
      <div class="hud-block">
        <div class="hud-lbl">SCORE</div>
        <div class="hud-val" id="scoreDisp">0</div>
      </div>
      <div id="powerBar">
        <div id="puIndicator">
          <span id="puIcon"></span>
          <span id="puName"></span>
          <div id="puTimerWrap"><div id="puTimerFill"></div></div>
          <span id="puUse" style="display:none;font-size:.6rem;opacity:.7">1 USE</span>
        </div>
      </div>
      <div class="hud-block">
        <div class="hud-lbl">BEST</div>
        <div class="hud-val" id="bestDisp">0</div>
      </div>
      <button class="icon-btn" id="muteBtn" title="Sound">🔊</button>
      <button class="icon-btn" id="pauseBtn" title="Pause (P)">⏸</button>
    </div>
    <div id="mathBar">
      <span id="mathQ-label">SOLVE ▸</span><span id="mathQuestion"></span>
    </div>
    <div id="canvasWrap">
      <canvas id="gameCanvas"></canvas>
      <div id="pauseOverlay">
        <div class="pause-title">⏸ PAUSED</div>
        <div class="pause-hint">PRESS P OR TAP TO RESUME</div>
        <button class="icon-btn" id="pauseMenuBtn" style="margin-top:10px;letter-spacing:.1em;font-size:.7rem">MAIN MENU</button>
      </div>
      <div id="countdownOverlay">
        <div id="countdownNum">3</div>
      </div>
    </div>
    <div id="dpad">
      <div class="drow"><div class="dblank"></div><div class="dbtn" id="dbU">▲</div><div class="dblank"></div></div>
      <div class="drow"><div class="dbtn" id="dbL">◄</div><div class="dblank"></div><div class="dbtn" id="dbR">►</div></div>
      <div class="drow"><div class="dblank"></div><div class="dbtn" id="dbD">▼</div><div class="dblank"></div></div>
    </div>
  </div>
</div>

<!-- ══ GAME OVER SCREEN ══ -->
<div id="goScreen" class="screen">
  <div class="go-card">
    <div class="go-title">MISSION FAILED</div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px">
      <div class="go-score-lbl">FINAL SCORE</div>
      <div class="go-score" id="goScore">0</div>
      <div class="go-badge" id="goBadge">★ NEW HIGH SCORE ★</div>
    </div>
    <div class="lb-box">
      <div class="lb-title">▸ HALL OF FAME ◂</div>
      <ul class="lb-list" id="goLb"></ul>
    </div>
    <div class="go-btns">
      <button class="retry-btn" id="retryBtn">▶ RETRY</button>
      <button class="menu-btn"  id="menuBtn">MENU</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ══════════════════════════════════════════
// CONSTANTS
// ══════════════════════════════════════════
const COLS = 30, ROWS = 22, CELL = 20;
const CW = COLS * CELL, CH = ROWS * CELL; // 600 × 440

const DIR = { UP:{x:0,y:-1}, DOWN:{x:0,y:1}, LEFT:{x:-1,y:0}, RIGHT:{x:1,y:0} };

const DIFF = {
  easy:   { ms:170, mult:1,   color:'#00ff88', label:'EASY'   },
  medium: { ms:115, mult:1.5, color:'#ffaa00', label:'MEDIUM' },
  hard:   { ms: 72, mult:2,   color:'#ff4444', label:'HARD'   }
};

const PU = {
  BOOST:  { color:'#ffff00', icon:'⚡', label:'SPEED BOOST', dur:5000 },
  SLOWMO: { color:'#00eeff', icon:'❄',  label:'SLOW MOTION', dur:6000 },
  DOUBLE: { color:'#ff00ff', icon:'✦',  label:'2× SCORE',    dur:8000 },
  SHIELD: { color:'#00ff88', icon:'◈',  label:'WALL SHIELD', dur:7000 }
};

const PLANET_PAL = [
  ['#ff6b35','#ffa070'],['#e8a000','#ffd060'],['#a855f7','#c084fc'],
  ['#22c55e','#6ee7a0'],['#ef4444','#f87070'],['#3b82f6','#60a5fa'],
  ['#ec4899','#f472b6'],['#14b8a6','#2dd4bf'],['#f97316','#fdba74'],
  ['#8b5cf6','#a78bfa']
];

const LB_KEY = 'snakeai_v4_lb';

// ══════════════════════════════════════════
// AUDIO
// ══════════════════════════════════════════
const audio = (() => {
  let ctx, master, bgm, sfx, nodes = [], muted = false, ready = false;

  function init() {
    if (ready) { resume(); return; }
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = .55; master.connect(ctx.destination);
      bgm = ctx.createGain(); bgm.gain.value = .22; bgm.connect(master);
      sfx = ctx.createGain(); sfx.gain.value = .65; sfx.connect(master);
      ready = true;
      _startBgm();
    } catch(e){}
  }

  function resume() { if (ctx && ctx.state === 'suspended') ctx.resume(); }

  function _startBgm() {
    const drones = [{f:55,v:.13,lfo:.07},{f:82.41,v:.09,lfo:.11},{f:110,v:.06,lfo:.05}];
    drones.forEach(({f,v,lfo}) => {
      const o = ctx.createOscillator(), g = ctx.createGain(), flt = ctx.createBiquadFilter();
      const lfoO = ctx.createOscillator(), lfoG = ctx.createGain();
      o.type='sine'; o.frequency.value=f; g.gain.value=v;
      flt.type='lowpass'; flt.frequency.value=500;
      lfoO.frequency.value=lfo; lfoG.gain.value=f*.012;
      lfoO.connect(lfoG); lfoG.connect(o.frequency);
      o.connect(flt); flt.connect(g); g.connect(bgm);
      o.start(); lfoO.start(); nodes.push(o,lfoO);
    });
    // Pad chord (Am)
    [220,261.63,329.63,440].forEach((f,i) => {
      const o = ctx.createOscillator(), g = ctx.createGain(), flt = ctx.createBiquadFilter();
      o.type='triangle'; o.frequency.value=f; flt.type='lowpass'; flt.frequency.value=900;
      g.gain.setValueAtTime(0, ctx.currentTime);
      g.gain.linearRampToValueAtTime(.03, ctx.currentTime+3+i*1.5);
      o.connect(flt); flt.connect(g); g.connect(bgm);
      o.start(); nodes.push(o);
    });
  }

  function _play(freqs, type, gainVals, startOffs) {
    if (!ready || muted) return;
    freqs.forEach((f,i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type;
      if (typeof f === 'function') f(o.frequency);
      else o.frequency.value = f;
      const t = ctx.currentTime + (startOffs?.[i]||0);
      const [v0,v1,dur] = gainVals[i] || [.3,.001,.15];
      g.gain.setValueAtTime(v0,t);
      g.gain.exponentialRampToValueAtTime(v1,t+dur);
      o.connect(g); g.connect(sfx);
      o.start(t); o.stop(t+dur+.01);
    });
  }

  return {
    init, resume,
    eat() {
      _play([f=>{f.setValueAtTime(440,ctx.currentTime);f.exponentialRampToValueAtTime(880,ctx.currentTime+.09)}],
        'sine', [[.35,.001,.12]], [0]);
    },
    powerup() {
      _play([523.25,659.25,783.99,1046.5],'sine',
        [[.28,.001,.18],[.28,.001,.18],[.28,.001,.18],[.28,.001,.18]],[0,.08,.16,.24]);
    },
    expire() {
      _play([380,300,240],'sine',[[.18,.001,.15],[.15,.001,.15],[.12,.001,.15]],[0,.1,.2]);
    },
    gameover() {
      _play([380,300,230,180,130,100],'sawtooth',
        [[.22,.001,.22],[.2,.001,.22],[.18,.001,.22],[.16,.001,.22],[.14,.001,.22],[.12,.001,.22]],
        [0,.12,.24,.36,.48,.6]);
    },
    toggleMute() {
      muted = !muted;
      if (master) master.gain.value = muted ? 0 : .55;
      return muted;
    }
  };
})();

// ══════════════════════════════════════════
// PARTICLES
// ══════════════════════════════════════════
class Particle {
  constructor(x,y,color,big) {
    this.x=x; this.y=y; this.color=color;
    const spd = big ? Math.random()*5+2 : Math.random()*3+1;
    const a = Math.random()*Math.PI*2;
    this.vx=Math.cos(a)*spd; this.vy=Math.sin(a)*spd;
    this.life=1; this.size=big?Math.random()*4+2:Math.random()*3+1;
    this.decay=big?.012+Math.random()*.01:.025+Math.random()*.02;
  }
  update(){this.x+=this.vx;this.y+=this.vy;this.vy+=.06;this.vx*=.97;this.life-=this.decay}
  draw(c){
    c.save();c.globalAlpha=Math.max(0,this.life);
    c.fillStyle=this.color;c.shadowBlur=8;c.shadowColor=this.color;
    c.beginPath();c.arc(this.x,this.y,this.size*this.life,0,Math.PI*2);c.fill();
    c.restore();
  }
}
const particles = { list:[], burst(x,y,col,n=15,big=false){for(let i=0;i<n;i++)this.list.push(new Particle(x,y,col,big))},
  tick(){this.list=this.list.filter(p=>p.life>0);this.list.forEach(p=>p.update())},
  draw(c){this.list.forEach(p=>p.draw(c))} };

// ══════════════════════════════════════════
// BACKGROUND CANVAS (global starfield)
// ══════════════════════════════════════════
const bgCv = document.getElementById('bgCanvas');
const bgCx = bgCv.getContext('2d');
let bgStars = [];

function initBg() {
  bgCv.width = innerWidth; bgCv.height = innerHeight;
  bgStars = Array.from({length:220},()=>({
    x:Math.random()*innerWidth, y:Math.random()*innerHeight,
    r:Math.random()*1.4+.2,
    base:Math.random()*.6+.1,
    spd:Math.random()*2+.4,
    phase:Math.random()*Math.PI*2
  }));
}

function drawBg(t) {
  const w=bgCv.width, h=bgCv.height;
  // Deep space gradient
  const rg=bgCx.createRadialGradient(w/2,h/2,0,w/2,h/2,Math.max(w,h)*.7);
  rg.addColorStop(0,'#090920'); rg.addColorStop(1,'#000000');
  bgCx.fillStyle=rg; bgCx.fillRect(0,0,w,h);
  // Corner nebulae
  [[0,0,'#18006633'],[w,0,'#001a4433'],[0,h,'#0d004433'],[w,h,'#1a001833']].forEach(([nx,ny,nc])=>{
    const ng=bgCx.createRadialGradient(nx,ny,0,nx,ny,w*.55);
    ng.addColorStop(0,nc); ng.addColorStop(1,'transparent');
    bgCx.fillStyle=ng; bgCx.fillRect(0,0,w,h);
  });
  // Stars
  bgStars.forEach(s=>{
    bgCx.globalAlpha=s.base+Math.sin(t*s.spd+s.phase)*.25;
    bgCx.fillStyle='#c0d8ff';
    bgCx.beginPath(); bgCx.arc(s.x,s.y,s.r,0,Math.PI*2); bgCx.fill();
  });
  bgCx.globalAlpha=1;
}

const cv = document.getElementById('gameCanvas');
const cx = cv.getContext('2d');
cv.width=CW; cv.height=CH;

// Game starfield (inside game canvas)
const gameStars = Array.from({length:120},()=>({
  x:Math.random()*CW, y:Math.random()*CH,
  r:Math.random()*.9+.15,
  base:Math.random()*.5+.1,
  spd:Math.random()*1.8+.3,
  phase:Math.random()*Math.PI*2
}));

function scaleCanvas() {
  const maxW=Math.min(innerWidth-20,960), maxH=Math.min(innerHeight-140,680);
  const sc=Math.min(maxW/CW,maxH/CH);
  cv.style.width=Math.round(CW*sc)+'px'; cv.style.height=Math.round(CH*sc)+'px';
}

// LEADERBOARD
// ══════════════════════════════════════════
function getLb(){ try{return JSON.parse(localStorage.getItem(LB_KEY))||[]}catch{return[]} }
function addScore(name,score,diff){
  const lb=getLb();
  lb.push({name:name||'PILOT',score,diff:diff.toUpperCase(),date:new Date().toLocaleDateString()});
  lb.sort((a,b)=>b.score-a.score); lb.splice(10);
  localStorage.setItem(LB_KEY,JSON.stringify(lb)); return lb;
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function renderLb(el,lb){
  if(!lb||!lb.length){el.innerHTML='<li class="lb-empty">No scores yet!</li>';return}
  el.innerHTML=lb.slice(0,8).map((e,i)=>`<li>
    <span class="lb-rank">${['🥇','🥈','🥉'][i]||'#'+(i+1)}</span>
    <span class="lb-name">${esc(e.name)}</span>
    <span class="lb-diff">${e.diff||''}</span>
    <span class="lb-score">${e.score}</span>
  </li>`).join('');
}

// MATH MODE
// ══════════════════════════════════════════
const MATH_GEN={
  easy:  ()=>{const a=~~(Math.random()*9)+1,b=~~(Math.random()*9)+1; return{q:`${a} + ${b} = ?`,ans:a+b}},
  medium:()=>{const a=~~(Math.random()*9)+2,b=~~(Math.random()*9)+2; return{q:`${a} × ${b} = ?`,ans:a*b}},
  hard:  ()=>{const a=~~(Math.random()*12)+4,b=~~(Math.random()*12)+4;return{q:`${a} × ${b} = ?`,ans:a*b}}
};
function genQuestion(){
  currentQ=MATH_GEN[diff]();
  const el=document.getElementById('mathQuestion');
  if(el) el.textContent=currentQ.q;
}

// ══════════════════════════════════════════
// GAME STATE
// ══════════════════════════════════════════
let state='start', diff='medium', pilotName='PILOT';
let snake, dir, dirQ, food, powerUpObj;
let score, best;
let mathMode=false, currentQ=null;
let activePU=null, puTimer=0, puDur=0, shieldOn=false, multiplier=1;
let puSpawnIn=0;
let moveTimer=0;
let lastTs=0;

const PU_SPAWN_MIN=13000, PU_SPAWN_MAX=21000, PU_LIFE=9000;

function getMs(){
  const b=DIFF[diff].ms;
  if(activePU==='BOOST') return b*.52;
  if(activePU==='SLOWMO') return b*1.85;
  return b;
}

function initGame(){
  const sx=Math.floor(COLS/2), sy=Math.floor(ROWS/2);
  snake=[{x:sx,y:sy},{x:sx-1,y:sy},{x:sx-2,y:sy},{x:sx-3,y:sy},{x:sx-4,y:sy}];
  dir={...DIR.RIGHT}; dirQ=[];
  score=0; multiplier=1; shieldOn=false; activePU=null; puTimer=0;
  powerUpObj=null;
  puSpawnIn=PU_SPAWN_MIN+Math.random()*(PU_SPAWN_MAX-PU_SPAWN_MIN);
  food=spawnFood();
  updateHud(); hidePuHud();
}

function spawnFood(){
  let p;
  do{p={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)}}
  while(snake.some(s=>s.x===p.x&&s.y===p.y)||(powerUpObj&&powerUpObj.x===p.x&&powerUpObj.y===p.y));
  const pal=PLANET_PAL[Math.floor(Math.random()*PLANET_PAL.length)];
  if(mathMode) genQuestion();
  return{...p,col:pal[0],hi:pal[1],ring:Math.random()>.45};
}

function spawnPu(){
  const keys=Object.keys(PU), type=keys[Math.floor(Math.random()*keys.length)];
  let p;
  do{p={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)}}
  while(snake.some(s=>s.x===p.x&&s.y===p.y)||(food.x===p.x&&food.y===p.y));
  return{...p,type,life:PU_LIFE};
}

function oppDir(a,b){return a.x===-b.x&&a.y===-b.y}
function pushDir(d){
  if(state!=='playing')return;
  const last=dirQ.length?dirQ[dirQ.length-1]:dir;
  if(dirQ.length<2&&!oppDir(d,last))dirQ.push({...d});
}

// ══════════════════════════════════════════
// MOVE LOGIC
// ══════════════════════════════════════════
function tick(){
  if(dirQ.length){const nd=dirQ.shift();if(!oppDir(nd,dir))dir={...nd}}
  const head=snake[0];
  let nx=head.x+dir.x, ny=head.y+dir.y;

  // Wall collision
  if(nx<0||nx>=COLS||ny<0||ny>=ROWS){
    if(shieldOn){
      nx=(nx+COLS)%COLS; ny=(ny+ROWS)%ROWS;
      shieldOn=false; activePU=null; hidePuHud();
      particles.burst(head.x*CELL+CELL/2,head.y*CELL+CELL/2,'#00ff88',22,true);
      toast('◈ SHIELD ABSORBED WALL!');
    } else { gameOver(); return; }
  }
  snake.unshift({x:nx,y:ny});

  if(nx===food.x&&ny===food.y){
    const pts=Math.round(10*multiplier*DIFF[diff].mult);
    score+=pts; best=Math.max(best,score);
    audio.eat();
    particles.burst(nx*CELL+CELL/2,ny*CELL+CELL/2,food.col,18);
    if(mathMode&&currentQ) toast(`✓ ${currentQ.q.replace('= ?','=')} ${currentQ.ans}`);
    food=spawnFood();
  } else { snake.pop(); }

  if(powerUpObj&&nx===powerUpObj.x&&ny===powerUpObj.y){
    collectPu(powerUpObj.type); powerUpObj=null;
  }
  updateHud();
}

function collectPu(type){
  audio.powerup();
  const info=PU[type];
  particles.burst(snake[0].x*CELL+CELL/2,snake[0].y*CELL+CELL/2,info.color,28,true);
  toast(info.icon+' '+info.label+'!');
  activePU=type; puTimer=info.dur; puDur=info.dur;
  if(type==='DOUBLE') multiplier=2;
  if(type==='SHIELD') shieldOn=true;
  showPuHud(type);
}

function expirePu(){
  audio.expire();
  if(activePU==='DOUBLE') multiplier=1;
  if(activePU==='SHIELD') shieldOn=false;
  activePU=null; hidePuHud();
}

function gameOver(){
  state='gameover';
  audio.gameover();
  const h=snake[0];
  particles.burst(h.x*CELL+CELL/2,h.y*CELL+CELL/2,'#ff3333',40,true);
  particles.burst(h.x*CELL+CELL/2,h.y*CELL+CELL/2,'#00ffff',20,true);
  const lb=addScore(pilotName,score,diff);
  const isNew=lb[0]&&lb[0].score===score;
  document.getElementById('goScore').textContent=score;
  document.getElementById('goBadge').classList.toggle('show',isNew);
  renderLb(document.getElementById('goLb'),lb);
  setTimeout(()=>showScreen('goScreen'),700);
}

// ══════════════════════════════════════════
// DRAWING
// ══════════════════════════════════════════
function lerp(a,b,t){return a+(b-a)*t}

function drawStarfield(t){
  const rg=cx.createRadialGradient(CW/2,CH/2,0,CW/2,CH/2,Math.max(CW,CH)*.7);
  rg.addColorStop(0,'#0b0b24'); rg.addColorStop(1,'#020208');
  cx.fillStyle=rg; cx.fillRect(0,0,CW,CH);
  // Corner nebulae — more vivid
  [[0,0,'#1a006688'],[CW,0,'#001a5566'],[0,CH,'#0d006655'],[CW,CH,'#200033aa']].forEach(([nx,ny,nc])=>{
    const ng=cx.createRadialGradient(nx,ny,0,nx,ny,CW*.65);
    ng.addColorStop(0,nc); ng.addColorStop(1,'transparent');
    cx.fillStyle=ng; cx.fillRect(0,0,CW,CH);
  });
  // Central soft glow
  const cg=cx.createRadialGradient(CW/2,CH/2,0,CW/2,CH/2,CW*.4);
  cg.addColorStop(0,'#05052233'); cg.addColorStop(1,'transparent');
  cx.fillStyle=cg; cx.fillRect(0,0,CW,CH);
  gameStars.forEach(s=>{
    const a=Math.min(1,(s.base+Math.sin(t*s.spd+s.phase)*.3)*1.6);
    cx.globalAlpha=a;
    if(a>0.6){cx.shadowBlur=4;cx.shadowColor='#aaccff'}
    cx.fillStyle='#c8ddff';
    cx.beginPath(); cx.arc(s.x,s.y,s.r,0,Math.PI*2); cx.fill();
    cx.shadowBlur=0;
  });
  cx.globalAlpha=1;
  // Grid
  cx.strokeStyle='#0044cc12'; cx.lineWidth=.5;
  for(let x=0;x<=CW;x+=CELL){cx.beginPath();cx.moveTo(x,0);cx.lineTo(x,CH);cx.stroke()}
  for(let y=0;y<=CH;y+=CELL){cx.beginPath();cx.moveTo(0,y);cx.lineTo(CW,y);cx.stroke()}
}

function drawSnake(t){
  const len=snake.length;
  for(let i=len-1;i>=0;i--){
    const seg=snake[i], nx2=snake[i+1], pct=1-i/len;
    const scx=seg.x*CELL+CELL/2, scy=seg.y*CELL+CELL/2;
    const r=Math.round(lerp(0x11,0x00,pct));
    const g=Math.round(lerp(0x22,0xff,pct));
    const b=Math.round(lerp(0x88,0xff,pct));
    const col=`rgb(${r},${g},${b})`;
    const rad=(i===0?CELL*.46:CELL*.34+CELL*.05*pct);

    // Connector
    if(nx2){
      const nx=nx2.x*CELL+CELL/2, ny=nx2.y*CELL+CELL/2;
      cx.save();
      cx.strokeStyle=col; cx.lineWidth=rad*1.85; cx.lineCap='round';
      cx.globalAlpha=.88; cx.shadowBlur=6*pct; cx.shadowColor=col;
      cx.beginPath(); cx.moveTo(scx,scy); cx.lineTo(nx,ny); cx.stroke();
      cx.restore();
    }

    cx.save();
    cx.shadowBlur=i===0?(shieldOn?32:26):10*pct;
    cx.shadowColor=i===0?(shieldOn?'#00ff88':'#00ffff'):col;
    cx.fillStyle=col;
    cx.beginPath(); cx.arc(scx,scy,rad,0,Math.PI*2); cx.fill();

    if(i===0){
      // Eyes
      const eo=CELL*.14;
      const px=-dir.y*eo, py=dir.x*eo;
      const fx=dir.x*eo*.75, fy=dir.y*eo*.75;
      cx.fillStyle='#001'; cx.shadowBlur=0;
      cx.beginPath();
      cx.arc(scx+fx+px,scy+fy+py,2.8,0,Math.PI*2);
      cx.arc(scx+fx-px,scy+fy-py,2.8,0,Math.PI*2);
      cx.fill();
      cx.fillStyle='#fff';
      cx.beginPath();
      cx.arc(scx+fx+px+.6,scy+fy+py-.6,1.1,0,Math.PI*2);
      cx.arc(scx+fx-px+.6,scy+fy-py-.6,1.1,0,Math.PI*2);
      cx.fill();
      if(shieldOn){
        cx.strokeStyle='#00ff88'; cx.lineWidth=1.5;
        cx.globalAlpha=.5+.3*Math.sin(t*5);
        cx.beginPath(); cx.arc(scx,scy,rad+5,0,Math.PI*2); cx.stroke();
      }
    }
    cx.restore();
  }
}

function drawFood(t){
  const {x,y,col,hi,ring}=food;
  const scx=x*CELL+CELL/2, scy=y*CELL+CELL/2+Math.sin(t*2)*2;
  const r=CELL*.44;
  cx.save(); cx.shadowBlur=28; cx.shadowColor=col;
  if(ring){
    cx.save(); cx.translate(scx,scy); cx.rotate(Math.sin(t*.35)*.3); cx.scale(1,.28);
    cx.strokeStyle=hi+'99'; cx.lineWidth=2.5; cx.shadowBlur=8; cx.shadowColor=hi;
    cx.beginPath(); cx.arc(0,0,r*1.65,0,Math.PI*2); cx.stroke(); cx.restore();
  }
  const g=cx.createRadialGradient(scx-r*.3,scy-r*.3,0,scx,scy,r);
  g.addColorStop(0,hi); g.addColorStop(.55,col); g.addColorStop(1,'#000010');
  cx.fillStyle=g; cx.beginPath(); cx.arc(scx,scy,r,0,Math.PI*2); cx.fill();
  const hl=cx.createRadialGradient(scx-r*.4,scy-r*.4,0,scx-r*.2,scy-r*.2,r*.55);
  hl.addColorStop(0,'rgba(255,255,255,.55)'); hl.addColorStop(1,'transparent');
  cx.fillStyle=hl; cx.beginPath(); cx.arc(scx,scy,r,0,Math.PI*2); cx.fill();
  if(mathMode&&currentQ){
    const ans=String(currentQ.ans);
    const fs=Math.round(r*(ans.length>2?.52:ans.length>1?.72:.92));
    cx.shadowBlur=0; cx.fillStyle='#fff';
    cx.font=`bold ${fs}px 'Share Tech Mono',monospace`;
    cx.textAlign='center'; cx.textBaseline='middle';
    cx.fillText(ans,scx,scy+1);
  }
  cx.restore();
}

function drawPowerUp(t){
  if(!powerUpObj)return;
  const {x,y,type,life}=powerUpObj;
  const info=PU[type];
  const scx=x*CELL+CELL/2, scy=y*CELL+CELL/2;
  const pulse=.85+.15*Math.sin(t*4), r=CELL*.4*pulse;
  const lf=Math.min(1,life/PU_LIFE);
  cx.save(); cx.globalAlpha=Math.min(1,lf*3);
  cx.shadowBlur=22*pulse; cx.shadowColor=info.color;
  // Timer arc
  cx.strokeStyle=info.color+'66'; cx.lineWidth=2;
  cx.beginPath(); cx.arc(scx,scy,r+6,-Math.PI/2,-Math.PI/2+Math.PI*2*lf); cx.stroke();
  // Orbital dots
  cx.save(); cx.translate(scx,scy); cx.rotate(t*2.2);
  for(let i=0;i<5;i++){const a=i/5*Math.PI*2;cx.fillStyle=info.color+'55';cx.beginPath();cx.arc(Math.cos(a)*(r+3),Math.sin(a)*(r+3),1.8,0,Math.PI*2);cx.fill()}
  cx.restore();
  // Orb
  const og=cx.createRadialGradient(scx-r*.3,scy-r*.3,0,scx,scy,r);
  og.addColorStop(0,'#ffffff'); og.addColorStop(.3,info.color); og.addColorStop(1,info.color+'33');
  cx.fillStyle=og; cx.beginPath(); cx.arc(scx,scy,r,0,Math.PI*2); cx.fill();
  cx.fillStyle='#000'; cx.shadowBlur=0;
  cx.font=`bold ${Math.round(r*.9)}px sans-serif`;
  cx.textAlign='center'; cx.textBaseline='middle';
  cx.fillText(info.icon,scx,scy+1);
  cx.restore();
}

function drawDiffLabel(){
  const d=DIFF[diff];
  cx.save(); cx.font='8px Orbitron,sans-serif';
  cx.fillStyle=d.color+'66'; cx.textAlign='right';
  cx.fillText(d.label, CW-4, CH-4); cx.restore();
}

// ══════════════════════════════════════════
// MAIN LOOP
// ══════════════════════════════════════════
function loop(ts){
  requestAnimationFrame(loop);
  const dt=Math.min(ts-lastTs,50); lastTs=ts;
  const t=ts/1000;

  particles.tick();
  drawBg(t);
  if(state==='start'||state==='countdown'||state==='playing'||state==='paused'||state==='gameover'){
    cx.clearRect(0,0,CW,CH);
    drawStarfield(t);
    if(state!=='start'){
      drawFood(t);
      if(powerUpObj)drawPowerUp(t);
      drawSnake(t);
    }
    particles.draw(cx);
    if(state==='playing')drawDiffLabel();
  }

  if(state==='playing'){
    moveTimer+=dt;
    if(activePU&&activePU!=='SHIELD'){
      puTimer-=dt;
      document.getElementById('puTimerFill').style.width=Math.max(0,puTimer/puDur*100)+'%';
      if(puTimer<=0)expirePu();
    }
    if(!powerUpObj){
      puSpawnIn-=dt;
      if(puSpawnIn<=0){powerUpObj=spawnPu();puSpawnIn=PU_SPAWN_MIN+Math.random()*(PU_SPAWN_MAX-PU_SPAWN_MIN)}
    } else {
      powerUpObj.life-=dt;
      if(powerUpObj.life<=0)powerUpObj=null;
    }
    if(moveTimer>=getMs()){moveTimer=0;tick()}
  }
}

function updateHud(){
  document.getElementById('scoreDisp').textContent=score;
  document.getElementById('bestDisp').textContent=best;
}
function showPuHud(type){
  const info=PU[type];
  const isShield=type==='SHIELD';
  const el=document.getElementById('puIndicator');
  el.style.display='flex'; el.style.color=info.color; el.style.borderColor=info.color;
  document.getElementById('puIcon').textContent=info.icon;
  document.getElementById('puName').textContent=info.label;
  document.getElementById('puTimerFill').style.background=info.color;
  document.getElementById('puTimerFill').style.width='100%';
  document.getElementById('puTimerWrap').style.display=isShield?'none':'block';
  document.getElementById('puUse').style.display=isShield?'inline':'none';
}
function hidePuHud(){
  document.getElementById('puIndicator').style.display='none';
  document.getElementById('puTimerWrap').style.display='block';
  document.getElementById('puUse').style.display='none';
}

let toastTmr=null;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toastTmr);
  toastTmr=setTimeout(()=>el.classList.remove('show'),2200);
}

// ══════════════════════════════════════════
// SCREENS
// ══════════════════════════════════════════
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startCountdown(cb){
  state='countdown';
  const ovl=document.getElementById('countdownOverlay');
  const num=document.getElementById('countdownNum');
  ovl.classList.add('show');
  let n=3;
  num.textContent=n;
  const iv=setInterval(()=>{
    n--;
    if(n===0){num.textContent='GO!';num.style.color='#00ff88'}
    else if(n<0){clearInterval(iv);ovl.classList.remove('show');num.style.color='#00ffff';cb()}
    else{num.textContent=n;num.style.animationName='none';requestAnimationFrame(()=>{num.style.animationName='cdbounce'})}
  },800);
}

// ══════════════════════════════════════════
// PAUSE
// ══════════════════════════════════════════
function togglePause(){
  if(state==='playing'){
    state='paused';
    document.getElementById('pauseOverlay').classList.add('show');
    document.getElementById('pauseBtn').textContent='▶';
  } else if(state==='paused'){
    state='playing';
    document.getElementById('pauseOverlay').classList.remove('show');
    document.getElementById('pauseBtn').textContent='⏸';
    lastTs=performance.now();
  }
}

// ══════════════════════════════════════════
// INPUT
// ══════════════════════════════════════════
document.addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
  switch(e.key){
    case'ArrowUp':   case'w':case'W': pushDir(DIR.UP);    break;
    case'ArrowDown': case's':case'S': pushDir(DIR.DOWN);  break;
    case'ArrowLeft': case'a':case'A': pushDir(DIR.LEFT);  break;
    case'ArrowRight':case'd':case'D': pushDir(DIR.RIGHT); break;
    case'p':case'P':case'Escape':case' ': if(state==='playing'||state==='paused')togglePause(); break;
  }
});

// Touch swipe on canvas
let tStart=null;
cv.addEventListener('touchstart',e=>{tStart={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});
cv.addEventListener('touchend',e=>{
  if(!tStart)return;
  const dx=e.changedTouches[0].clientX-tStart.x, dy=e.changedTouches[0].clientY-tStart.y;
  if(Math.abs(dx)<8&&Math.abs(dy)<8){tStart=null;return}
  if(Math.abs(dx)>Math.abs(dy)) pushDir(dx>0?DIR.RIGHT:DIR.LEFT);
  else pushDir(dy>0?DIR.DOWN:DIR.UP);
  tStart=null;
},{passive:true});

// D-pad
[['dbU',DIR.UP],['dbD',DIR.DOWN],['dbL',DIR.LEFT],['dbR',DIR.RIGHT]].forEach(([id,d])=>{
  const btn=document.getElementById(id);
  btn.addEventListener('touchstart',e=>{e.preventDefault();pushDir(d);btn.classList.add('pressed')},{passive:false});
  btn.addEventListener('touchend',()=>btn.classList.remove('pressed'));
  btn.addEventListener('click',()=>pushDir(d));
});

// ══════════════════════════════════════════
// UI WIRING
// ══════════════════════════════════════════
document.querySelectorAll('.diff-btn').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.diff-btn').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel'); diff=b.dataset.d;
  });
});

document.getElementById('launchBtn').addEventListener('click',launch);
document.getElementById('nameInput').addEventListener('keydown',e=>{if(e.key==='Enter')launch()});

function launch(){
  pilotName=document.getElementById('nameInput').value.trim()||'PILOT';
  diff=document.querySelector('.diff-btn.sel')?.dataset.d||'medium';
  best=Math.max(...getLb().map(e=>e.score),0);
  audio.init();
  initGame();
  showScreen('gameScreen');
  scaleCanvas();
  document.getElementById('mathBar').style.display=mathMode?'block':'none';
  if(mathMode) genQuestion();
  // Show D-pad on mobile or small screen
  const mob=/Mobi|Android|iPhone|iPad|iPod/.test(navigator.userAgent)||innerWidth<700;
  if(mob)document.getElementById('dpad').classList.add('show');
  startCountdown(()=>{state='playing';lastTs=performance.now()});
}

document.getElementById('mathToggle').addEventListener('click',()=>{
  mathMode=!mathMode;
  const btn=document.getElementById('mathToggle');
  btn.classList.toggle('on',mathMode);
  btn.textContent=mathMode?'✓ MATH CHALLENGES ENABLED':'📐 ENABLE MATH CHALLENGES';
});

document.getElementById('pauseBtn').addEventListener('click',togglePause);
document.getElementById('pauseOverlay').addEventListener('click',togglePause);
document.getElementById('pauseMenuBtn').addEventListener('click',()=>{
  state='start';
  document.getElementById('mathBar').style.display='none';
  showScreen('startScreen');
  renderLb(document.getElementById('startLb'),getLb());
});
document.getElementById('muteBtn').addEventListener('click',()=>{
  const m=audio.toggleMute();
  document.getElementById('muteBtn').textContent=m?'🔇':'🔊';
});

document.getElementById('retryBtn').addEventListener('click',()=>{
  audio.init();
  initGame();
  showScreen('gameScreen');
  scaleCanvas();
  document.getElementById('mathBar').style.display=mathMode?'block':'none';
  if(mathMode) genQuestion();
  startCountdown(()=>{state='playing';lastTs=performance.now()});
});
document.getElementById('menuBtn').addEventListener('click',()=>{
  state='start';
  document.getElementById('mathBar').style.display='none';
  showScreen('startScreen');
  renderLb(document.getElementById('startLb'),getLb());
});

// ══════════════════════════════════════════
// BOOT
// ══════════════════════════════════════════
window.addEventListener('load',()=>{
  initBg(); scaleCanvas();
  renderLb(document.getElementById('startLb'),getLb());
  lastTs=performance.now();
  requestAnimationFrame(loop);
  showScreen('startScreen');
});

window.addEventListener('resize',()=>{
  bgCv.width=innerWidth; bgCv.height=innerHeight; initBg(); scaleCanvas();
});
</script>
</body>
</html>
